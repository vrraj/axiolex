# BM25S Retriever Configuration
# This file controls the behavior of the BM25S document retrieval service

bm25s:
  temperature: 0.5          # Softmax temperature (0.1-10.0)
  ignore_zero: true          # Filter zero-relevance documents
  llm_tools_cutoff: 10.0     # Minimum softmax percentage (0-100)

documents:
  source: "documents.yaml"   # Document source file
  auto_reload: true          # Auto-reload when file changes
  encoding: "utf-8"          # File encoding

server:
  host: "0.0.0.0"           # Server bind host
  port: 9700                 # Server port
  reload: false              # Enable auto-reload for development
  log_level: "info"          # Log level (debug, info, warning, error)

# Environment variables override these settings:
# BM25S_TEMPERATURE, BM25S_IGNORE_ZERO, BM25S_CUTOFF
# BM25S_HOST, BM25S_PORT, BM25S_LOG_LEVEL
#
# Optional hybrid search is intentionally environment-controlled because it
# requires the `axiolex[colbert]` package extra and downloads a ColBERT model:
# AXIOLEX_HYBRID_ENABLED=false
# AXIOLEX_COLBERT_MODEL=colbert-ir/colbertv2.0
# AXIOLEX_COLBERT_CACHE_DIR=~/.cache/axiolex/fastembed
# AXIOLEX_COLBERT_BATCH_SIZE=32
# AXIOLEX_HYBRID_CANDIDATE_LIMIT=100
# AXIOLEX_RRF_K=60
