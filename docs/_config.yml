# --- Site Metadata ---
title: "AxioLex"
tagline: "Fast lexical retrieval and tool routing for agentic systems"
description: "AxioLex routes LLM tools, documents, and MCP-discovered resources using fast deterministic BM25S retrieval with optional hybrid search."
url: "https://vrraj.github.io"
baseurl: "/axiolex"

defaults:
  - scope:
      path: "" # Applies to all files
    values:
      layout: "default"

  - scope:
      path: "index.md"
    values:
      title: "AxioLex: Fast lexical retrieval and tool routing"

  - scope:
      path: "setup-usage.md"
    values:
      title: "Setup & Usage | AxioLex"
      description: "Install, configure, and run AxioLex as a PyPI package, management platform, or automated pipeline."

  - scope:
      path: "api-reference.md"
    values:
      title: "API Reference | BM25S Retriever"
      description: "Complete API documentation for BM25SRetriever, BM25SClient, and configuration."

  - scope:
      path: "configuration.md"
    values:
      title: "Configuration Guide | BM25S Retriever"
      description: "Settings, environment variables, and configuration file reference."

# --- Theme Configuration ---
theme: jekyll-theme-cayman
show_downloads: true

# --- Google Analytics (GA4) ---

google_analytics: G-KBYFPBJ1MG

# --- Plugins ---
plugins:
  - jekyll-seo-tag
  - jekyll-gist

# --- Build Settings ---
markdown: kramdown
highlighter: rouge
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
