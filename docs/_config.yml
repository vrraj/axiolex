# --- Site Metadata ---
title: "Axiolex"
tagline: "Centralized tool discovery and execution for AI clients, applications, and agents"
description: "Axiolex centralizes tool discovery and execution across MCP, A2A, adapter-backed REST systems, and local/internal tools behind stable client interfaces."
url: "https://vrraj.github.io"
baseurl: "/axiolex"

defaults:
