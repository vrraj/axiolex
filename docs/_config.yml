# --- Site Metadata ---
title: "Axiolex"
tagline: "Centralized tool discovery and execution for AI clients, applications, and agents"
description: "Axiolex centralizes tool discovery and execution across MCP, A2A, adapter-backed REST systems, and local/internal tools behind stable client interfaces."
url: "https://vrraj.github.io"
baseurl: "/axiolex"

defaults:
  - scope:
      path: "" # Applies to all files
    values:
      layout: "default"

  - scope:
      path: "index.md"
    values:
      title: "Axiolex: Centralized Tool Discovery & Execution"

  - scope:
      path: "technical_architecture.md"
    values:
      title: "Technical Architecture | Axiolex"
      description: "System layers, request lifecycle, subsystems, module reference, and deployment for Axiolex."

  - scope:
      path: "app_reference.md"
    values:
      title: "Application Reference | Axiolex"
      description: "Install, SDK API, REST endpoints, CLI, configuration, and MCP integration for Axiolex."

  - scope:
      path: "mcp-clients.md"
    values:
      title: "Connect MCP Clients | Axiolex"
      description: "Connect Claude Desktop, Cursor, Codex, and other MCP clients to Axiolex for tool discovery and execution."

  - scope:
      path: "setup-usage.md"
    values:
      title: "Setup & Usage | Axiolex"
      description: "Install, configure, and run Axiolex as a PyPI package, management platform, or automated pipeline."

  - scope:
      path: "api-reference.md"
    values:
      title: "API Reference | Axiolex"
      description: "Complete REST and SDK API documentation for Axiolex."

  - scope:
      path: "architecture.md"
    values:
      title: "Architecture | Axiolex"
      description: "Axiolex architecture, retrieval engine, and security model."

# --- Theme Configuration ---
theme: jekyll-theme-cayman
show_downloads: true

# --- Google Analytics (GA4) ---

google_analytics: G-KBYFPBJ1MG

# --- Plugins ---
plugins:
  - jekyll-seo-tag
  - jekyll-gist

# --- Build Settings ---
markdown: kramdown
highlighter: rouge
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
