# --- Site Metadata ---
title: "Axiolex"
tagline: "Enterprise capability discovery for AI clients and applications"
description: "Axiolex maintains a searchable catalog of enterprise capabilities — MCP tools, A2A endpoints, internal services — and retrieves a small ranked set matched to the request intent and business scope."
url: "https://vrraj.github.io"
baseurl: "/axiolex"

defaults:
  - scope:
      path: "" # Applies to all files
    values:
      layout: "default"

  - scope:
      path: "index.md"
    values:
      title: "Axiolex: Enterprise Capability Discovery for AI Clients and Applications"

  - scope:
      path: "technical_architecture.md"
    values:
      title: "Technical Architecture | Axiolex"
      description: "System layers, request lifecycle, subsystems, module reference, and deployment for Axiolex."

  - scope:
      path: "app_reference.md"
    values:
      title: "Application Reference | Axiolex"
      description: "Install, SDK API, REST endpoints, CLI, configuration, and MCP integration for Axiolex."

  - scope:
      path: "claude-mcp.md"
    values:
      title: "Connect Claude Desktop | Axiolex"
      description: "Connect Claude Desktop to the Axiolex MCP server for tool discovery and execution."

  - scope:
      path: "setup-usage.md"
    values:
      title: "Setup & Usage | Axiolex"
      description: "Install, configure, and run Axiolex as a PyPI package, management platform, or automated pipeline."

  - scope:
      path: "api-reference.md"
    values:
      title: "API Reference | Axiolex"
      description: "Complete REST and SDK API documentation for Axiolex."

  - scope:
      path: "architecture.md"
    values:
      title: "Architecture | Axiolex"
      description: "Axiolex architecture, retrieval engine, and security model."

# --- Theme Configuration ---
theme: jekyll-theme-cayman
show_downloads: true

# --- Google Analytics (GA4) ---

google_analytics: G-KBYFPBJ1MG

# --- Plugins ---
plugins:
  - jekyll-seo-tag
  - jekyll-gist

# --- Build Settings ---
markdown: kramdown
highlighter: rouge
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
