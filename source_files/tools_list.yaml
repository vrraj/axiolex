# tools_list.yaml - Intent-Optimized for BM25S
# source: yaml, mcp-discovery, mcp-stream, mcp-stdio
# transport: http, grpc, websocket
# url: api endpoint, mcp endpoint, mcp tool list endpoint, mcp tool detail endpoint
# provider: internal, <external_provider_name>
# artifact: If the tool produces an artifact, set produces_artifact to true and specify the injection_mode and artifact_type
# placeholder format placeholder: "{{ARTIFACT:stock_chart_svg}}"


documents:
  - id: "get_customer_profile"
    title: "Get Customer Profile"
    content: "Lookup customer account details, contact information, profile settings, and membership status. Customer profile is required to create an order, email customer, or update customer information."
    keywords: ["customer profile", "account details", "contact info", "user lookup", "who is this customer", "customer data"]
    metadata:
      enabled: true
      source: "yaml"
      category: "crm"
      updated: "2025-04-07"
    runtime:
      provider: "internal"
      tool_name: "get_customer_profile"
      transport: "http"
      endpoint: "/api/customers/{customer_id}"
      params:
        customer_id: { type: "string", description: "The unique identifier for the customer." }
    artifact:
      produces_artifact: false
      injection_mode: verbatim
      artifact_type:
      placeholder:
      

  - id: "get_customer_orders"
    title: "Get Customer Orders"
    content: "Fetch a list of all historical purchases, transaction history, and order summaries for a specific customer."
    keywords: ["order history", "purchase history", "past orders", "what did they buy", "transaction list", "find orders"]
    metadata:
      enabled: true
      source: "yaml"
      category: "orders"
      updated: "2025-04-07"
    runtime:
      provider: "internal"
      tool_name: "get_customer_orders"
      transport: "http"
      endpoint: "/api/customers/{customer_id}/orders"
      params:
        customer_id: { type: "string", description: "ID of the customer whose orders are being retrieved." }
        status: { type: "string", enum: ["open", "closed", "all"], default: "all" }
    artifact:
      produces_artifact: false
      injection_mode: verbatim
      artifact_type:
      placeholder:

  - id: "get_order_details"
    title: "Get Order Details"
    content: "Retrieve specific line-item data, billing details, and status for a single order ID."
    keywords: ["order breakdown", "order status", "billing details", "order info", "sku list", "what is in this order"]
    metadata:
      enabled: true
      source: "yaml"
      category: "orders"
      updated: "2025-04-07"
    runtime:
      provider: "internal"
      tool_name: "get_order_details"
      transport: "http"
      endpoint: "/api/orders/{order_id}"
      params:
        order_id: { type: "string", description: "The specific order tracking number or ID." }
    artifact:
      produces_artifact: false
      injection_mode: verbatim
      artifact_type:
      placeholder:

  - id: "create_order"
    title: "Create New Order"
    content: "Start a new purchase, buy a product, or place a customer order. Use this to initiate a checkout process for items. PREREQUISITES: Get customer profile first."
    keywords: 
      - "buy"
      - "purchase"
      - "place order"
      - "checkout"
      - "start transaction"
      - "order item"
      - "buy product"
      - "new sale"
    metadata:
      enabled: true
      source: "yaml"
      category: "orders"
      updated: "2025-04-07"
    runtime:
      provider: "internal"
      tool_name: "create_order"
      transport: "http"
      endpoint: "/api/orders"
      params:
        customer_id: { type: "string" }
        product_id: { type: "string" }
        quantity: { type: "integer", minimum: 1 }
        price: { type: "number" }
    artifact:
      produces_artifact: false
      injection_mode: verbatim
      artifact_type:
      placeholder:

  - id: "cancel_order"
    title: "Cancel Order"
    content: "Void or cancel an order that has not been shipped yet."
    keywords: ["cancel order", "void order", "stop shipping", "undo purchase", "delete order", "cancel transaction"]
    metadata:
      enabled: true
      source: "yaml"
      category: "orders"
      updated: "2025-04-07"
    runtime:
      provider: "internal"
      tool_name: "cancel_order"
      transport: "http"
      endpoint: "/api/orders/{order_id}/cancel"
      params:
        order_id: { type: "string" }
        reason: { type: "string", description: "Reason for cancellation provided by the customer." }
    artifact:
      produces_artifact: false
      injection_mode: verbatim
      artifact_type:
      placeholder:

  - id: "update_order"
    title: "Update Order"
    content: "Change order details like quantity, shipping address, or product selections for an existing order."
    keywords: ["change order", "edit purchase", "update quantity", "wrong address", "modify order", "switch product"]
    metadata:
      enabled: true
      source: "yaml"
      category: "orders"
      updated: "2025-04-07"
    runtime:
      provider: "internal"
      tool_name: "update_order"
      transport: "http"
      endpoint: "/api/orders/{order_id}"
      params:
        order_id: { type: "string" }
        field: { type: "string", enum: ["quantity", "shipping_address", "product_id"] }
        new_value: { type: "string" }
    artifact:
      produces_artifact: false
      injection_mode: verbatim
      artifact_type:
      placeholder:

