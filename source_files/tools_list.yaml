  - id: "get_stock_price_history"
    title: "Get Stock Price History"
    content: "Fetch historical stock price data for a given symbol over a specified time period. Returns price history data that can be visualized as sparkline charts."
    keywords: ["stock price", "price history", "stock chart", "historical data", "stock performance", "market data"]
    metadata:
      enabled: false
      source: "mcp-discovery"
      category: "finance"
      updated: "2025-04-07"
    runtime:
      provider: "agis-markets"
      tool_name: "get_stock_price_history"
      transport: "mcp"
      endpoint:
        type: mcp
        url: http://localhost:9001/mcp
        tool: get_stock_price_history
      params:
        symbols: { type: "array", items: { type: "string" }, description: "List of stock symbols to fetch price history for." }
        period: { type: "string", description: "Time period for price history (e.g., 1D, 1W, 1M, 6M, 1Y)." }
    artifact:
      produces_artifact: true
      injection_mode: verbatim
      artifact_type: svg
      artifact_key: svg
      placeholder: "{{ARTIFACT:stock_chart_svg}}"
