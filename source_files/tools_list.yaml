    parameters:
      ticket_id: { type: "string" }
      priority: { type: "string", enum: ["high", "urgent", "critical"] }
    metadata:
      source: "yaml"
      category: "support"
      provider: "internal"
      updated: "2025-04-07"

  - id: "create_support_ticket"
    title: "Create Support Ticket"
    content: "Open a new support case or log a customer issue for investigation."
