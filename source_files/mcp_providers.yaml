providers:
- args: []
  auth:
    key_param: api_key
    secret_env: ALPHAVANTAGE_API_KEY
    type: api_key
  command: null
  enabled: true
  endpoint: https://mcp.alphavantage.co/mcp
  features:
    supports_streaming: true
  id: alphavantage_finance
  limits:
    max_page_size: 15
    max_requests_per_minute: 60
    max_results: 100
    timeout_seconds: 10
  name: Alpha Vantage MCP
  transport: streamable-http
- args: []
  auth:
    key_param: api_key
    secret_env: null
    type: none
  command: null
  enabled: true
  endpoint: http://localhost:9001/mcp
  features:
    supports_streaming: false
  id: aina_markets
  limits:
    max_page_size: 50
    max_requests_per_minute: 60
    max_results: 100
    timeout_seconds: 10
  name: Aina Markets
  transport: streamable-http
- args: []
  auth:
    key_param: tavilyApiKey
    secret_env: TAVILY_API_KEY
    type: api_key
  command: null
  enabled: true
  endpoint: https://mcp.tavily.com/mcp
  features:
    supports_streaming: false
  id: tavily_mcp
  limits:
    max_page_size: 50
    max_requests_per_minute: 60
    max_results: 100
    timeout_seconds: 10
  name: Tavily
  transport: streamable-http
