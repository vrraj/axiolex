[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiolex"
version = "2.0.0"
description = "AxioLex: Multi-modal retrieval primitive for agentic infrastructure (Lexical & Neural). Currently powered by BM25S + PyStemmer for lexical retrieval with routing layer for LLM tools, documents, and hybrid RAG"
authors = [{name = "Raj Rajkumar"}]
license = "GPL-3.0"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

keywords = ["bm25", "bm25s", "retrieval", "lexical-search", "llm", "rag", "tool-routing", "hybrid-rag", "pystemmer", "fastapi"]

dependencies = [
    "pydantic>=2.11.0,<3.0.0",
    "httpx>=0.28.1,<0.29.0",
]

[project.optional-dependencies]
server = [
    "bm25s>=0.3.2.post1,<0.4.0",
    "PyStemmer>=3.0.0,<4.0.0",
    "PyYAML>=6.0.3,<7.0.0",
    "mcp>=1.27.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "redis>=5.0.0,<6.0.0",
    "cryptography>=43.0.0,<46.0.0",
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn>=0.31.1,<0.50.0",
    "jinja2>=3.1.4,<3.2.0",
    "python-multipart>=0.0.9,<0.1.0",
    "jira>=3.10.0,<4.0.0",
]
dev = [
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "black>=24.10.0,<25.0.0",
    "ruff>=0.8.4,<0.9.0",
]
colbert = [
    "fastembed>=0.7.0,<0.9.0",
    "huggingface-hub>=0.24.0,<1.0.0",
    "numpy>=1.26.0,<3.0.0",
    "onnxruntime>=1.19.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/vrraj/axiolex"
Repository = "https://github.com/vrraj/axiolex"
Documentation = "https://vrraj.github.io/axiolex/"

[project.scripts]
axiolex = "axiolex.cli:main"
axiolex-server = "axiolex.cli:main"
axiolex-mcp-server = "axiolex.mcp.server:main"
axiolex-index = "axiolex.index_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["axiolex*"]

[tool.setuptools.package-data]
axiolex = ["source_files/*.yaml", ".env.example", "ui/templates/*.html", "ui/static/assets/*.js", "ui/static/assets/*.css"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.ruff]
line-length = 88
target-version = "py38"
